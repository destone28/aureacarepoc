<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AureaCare · Le mie cure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="js/styles.css">
  <style>
    .cure-card {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: 14px;
      margin-bottom: 10px;
      transition: all .15s ease;
      cursor: pointer;
    }
    .cure-card:hover { border-color: var(--care-blue); transform: translateY(-1px); box-shadow: var(--shadow); }
    .cure-head { display: flex; gap: 12px; align-items: center; }
    .cure-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--care-blue-light);
      color: var(--care-blue-dark);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cure-icon.pending { background: var(--b-pending-bg); color: var(--b-pending-tx); }
    .cure-icon.approved { background: var(--b-approved-bg); color: var(--b-approved-tx); }
    .cure-title { font-weight: 700; font-size: 14px; }
    .cure-meta { font-size: 12px; color: var(--medium-gray); margin-top: 2px; }
    .cure-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px;
    }
    /* Aggancio al questionario post-visita (bozza): compare solo sulle visite
       già svolte, cioè approvate con data passata. */
    .cure-followup {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-soft);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .cure-followup .fu-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700;
      color: var(--care-blue-dark);
      text-decoration: none;
    }
    .cure-followup .fu-link:hover { text-decoration: underline; }
    .cure-followup .fu-done {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      color: #0F6E56;
    }
  </style>
</head>
<body>
  <div class="patient-app">
    <header class="patient-header">
      <button class="icon-btn" onclick="history.back()" aria-label="Indietro"><span id="ico-back"></span></button>
      <div class="brand" style="font-size:15px">Le mie cure</div>
      <div class="app-switcher-wrap">
        <button class="icon-btn" data-app-switcher aria-label="App suite"><span id="ico-grid"></span></button>
      </div>
    </header>

    <div class="patient-content">
      <div class="tabs mb-16">
        <button class="tab active" data-filter="all">Tutte</button>
        <button class="tab" data-filter="pending">In attesa</button>
        <button class="tab" data-filter="approved">Approvate</button>
      </div>

      <p class="caption mb-12" id="cure-summary"></p>
      <div id="cure-list"></div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item" href="home.html"><span id="nv-home"></span>Home</a>
      <a class="nav-item" href="book-care.html"><span id="nv-book"></span>Prenota</a>
      <a class="nav-item active" href="my-cures.html"><span id="nv-cure"></span>Cure</a>
      <a class="nav-item" href="profile.html"><span id="nv-profile"></span>Profilo</a>
    </nav>
  </div>

  <!-- Modal dettaglio -->
  <div class="modal-overlay" id="cure-modal" onclick="if(event.target===this) closeModal('cure-modal')">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Dettaglio prenotazione</div>
        <button class="modal-close" onclick="closeModal('cure-modal')"><span id="ico-x"></span></button>
      </div>
      <div class="modal-body" id="cure-modal-body"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="data/mock-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById('ico-back').outerHTML = aIcon('arrow-left', { size: 20 });
    document.getElementById('ico-grid').outerHTML = aIcon('grid', { size: 20 });
    document.getElementById('ico-x').outerHTML = aIcon('x', { size: 16 });
    document.getElementById('nv-home').outerHTML   = aIcon('home',    { size: 22 });
    document.getElementById('nv-cure').outerHTML   = aIcon('heart',   { size: 22 });
    document.getElementById('nv-book').outerHTML   = aIcon('calendar',{ size: 22 });
    document.getElementById('nv-profile').outerHTML= aIcon('user',    { size: 22 });

    // Solo due stati esposti al paziente: In attesa · Approvata
    const statusMap = {
      pending:  { badge: 'badge--pending',  label: 'In attesa', icon: 'clock' },
      approved: { badge: 'badge--approved', label: 'Approvata', icon: 'check-circle' }
    };

    const certOf = b => { const s = (MOCK.structures || []).find(x => x.id === b.structure_id); return s ? s.cert : 'ISO 9001'; };

    // Questionario post-visita (bozza): call-to-action sulle visite svolte, cioè
    // approvate con data già passata. Se il paziente ha già risposto, la card
    // lo dichiara invece di richiederlo di nuovo.
    function followUpBar(b) {
      if (!isVisitDone(b)) return '';
      const done = getFollowUp(b.id);
      if (done) {
        return `<div class="cure-followup"><span class="fu-done">${aIcon('check-circle',{size:14})} Questionario inviato</span><span class="caption">Grazie</span></div>`;
      }
      return `<div class="cure-followup">
        <a class="fu-link" href="follow-up.html?booking=${b.id}" onclick="event.stopPropagation()">${aIcon('message-square',{size:14})} Com'è andata la visita?</a>
        <span class="badge badge--neutral">Bozza</span>
      </div>`;
    }

    let filter = 'all';
    function renderCures() {
      const list = document.getElementById('cure-list');
      const filtered = MOCK.bookings.filter(b => filter === 'all' ? true : b.status === filter);
      document.getElementById('cure-summary').textContent = `${filtered.length} prenotazioni` + (filter !== 'all' ? ` · filtro: ${statusMap[filter].label}` : '');
      list.innerHTML = '';
      filtered.sort((a,b) => b.id.localeCompare(a.id));
      filtered.forEach(b => {
        const s = statusMap[b.status] || statusMap.pending;
        const iconCls = b.status === 'approved' ? 'approved' : 'pending';
        const card = document.createElement('div');
        card.className = 'cure-card';
        card.onclick = () => openDetail(b);
        card.innerHTML = `
          <div class="cure-head">
            <div class="cure-icon ${iconCls}">${aIcon('heart', { size: 22 })}</div>
            <div style="flex:1;min-width:0">
              <div class="flex items-center gap-8 mb-4">
                <span class="badge ${s.badge}"><span class="dot"></span>${s.label}</span>
              </div>
              <div class="cure-title">${b.service_name}</div>
              <div class="cure-meta">${b.structure_name} · ${b.doctor}</div>
              <div class="cure-meta">${b.date} · ${b.time}</div>
              <div class="cure-meta" style="color:#0F6E56;font-weight:600;margin-top:4px">Coperta dal Programma Carelink</div>
            </div>
          </div>
          ${b.shuttle ? `<div class="cure-bar"><span style="color:var(--primary-orange);font-weight:600;display:flex;align-items:center;gap:6px">${aIcon('truck',{size:14})} Trasporto AureaShuttle <span class="badge badge--approved" style="font-weight:600">Samarcanda · gratuito</span></span><span class="caption">${b.status === 'approved' ? 'In agenda' : 'Da validare'}</span></div>` : ''}
          ${followUpBar(b)}`;
        list.appendChild(card);
      });
      if (!filtered.length) {
        list.innerHTML = `<div class="card card--padded-lg text-center" style="margin-top:12px">
          ${aIcon('calendar', { size: 32, cls: 'mb-12' })}
          <p style="font-weight:700">Nessuna prenotazione</p>
          <p class="caption">Non ci sono cure in questa categoria.</p>
        </div>`;
      }
    }

    document.querySelectorAll('.tabs .tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        filter = t.dataset.filter;
        renderCures();
      });
    });

    function openDetail(b) {
      const s = statusMap[b.status] || statusMap.pending;
      const body = document.getElementById('cure-modal-body');
      body.innerHTML = `
        <div class="flex items-center gap-12 mb-16">
          <div class="cure-icon" style="width:48px;height:48px">${aIcon('heart',{size:24})}</div>
          <div>
            <div class="flex items-center gap-8 mb-4"><span class="badge ${s.badge}"><span class="dot"></span>${s.label}</span></div>
            <p style="font-weight:700;font-size:16px">${b.service_name}</p>
            <p class="caption">${b.doctor}</p>
          </div>
        </div>

        <div style="display:grid;gap:8px;background:#FAFAFA;padding:12px;border-radius:10px;font-size:13px">
          <div style="display:flex;justify-content:space-between"><span class="text-muted">Struttura</span><strong>${b.structure_name}</strong></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="text-muted">Certificazione</span><strong style="display:flex;align-items:center;gap:5px">${aIcon('award',{size:13})}${certOf(b)}</strong></div>
          <div style="display:flex;justify-content:space-between"><span class="text-muted">Data</span><strong>${b.date}</strong></div>
          <div style="display:flex;justify-content:space-between"><span class="text-muted">Orario</span><strong>${b.time}</strong></div>
          <div style="display:flex;justify-content:space-between"><span class="text-muted">Riferimento</span><strong class="font-mono">${b.id}</strong></div>
          <div style="display:flex;justify-content:space-between"><span class="text-muted">Copertura</span><strong style="color:#0F6E56">Programma Carelink</strong></div>
          ${b.shuttle ? `<div style="display:flex;justify-content:space-between"><span class="text-muted">Trasporto</span><strong style="color:var(--primary-orange)">AureaShuttle · Samarcanda · gratuito</strong></div>` : ''}
        </div>

        <p class="caption mt-12" style="display:flex;align-items:flex-start;gap:6px;color:#0F6E56">${aIcon('shield-check',{size:14})}<span>Prestazione <strong>coperta dal Programma Carelink</strong>: nessun costo a tuo carico.</span></p>

        ${b.status === 'pending' ? `<p class="caption mt-12">In attesa di validazione del <strong>Coordinatore Alphio</strong> · tempi medi 2-4 ore lavorative.</p>` : ''}

        ${isVisitDone(b) && !getFollowUp(b.id) ? `<a class="btn btn--secondary btn--block mt-16" href="follow-up.html?booking=${b.id}">${aIcon('message-square',{size:16})} Com'è andata la visita? <span class="badge badge--neutral">Bozza</span></a>` : ''}

        <div class="flex gap-8 mt-16">
          ${b.status === 'pending'
            ? `<button class="btn btn--danger" style="flex:1" onclick="cancel()">Annulla richiesta</button>`
            : `<button class="btn btn--danger" style="flex:1" onclick="cancel()">Cancella</button><button class="btn btn--secondary" style="flex:1" onclick="reschedule('${b.id}')">Sposta</button>`}
        </div>`;
      openModal('cure-modal');
    }

    function reschedule(id) {
      closeModal('cure-modal');
      const b = MOCK.bookings.find(x => x.id === id);
      if (!b) return;
      // Trova structure_id corrispondente (se mappato)
      const sid = b.structure_id || 'STR-001';
      showConfirmDialog(
        'Sposta la prenotazione',
        'Verrai portato al calendario per scegliere un nuovo orario per "' + b.service_name + '". La data attuale (' + b.date + ') sarà liberata.',
        () => location.href = 'booking.html?structure=' + sid + '&service=' + (b.service_id || '') + '&reschedule=' + id,
        { confirmLabel: 'Scegli nuovo slot' }
      );
    }

    function cancel() {
      closeModal();
      showConfirmDialog('Annullare la prenotazione?', 'La richiesta sarà ritirata. Potrai riprenotare la prestazione in qualsiasi momento: resta coperta dal Programma Carelink.',
        () => showToast('Prenotazione annullata','info'),
        { confirmLabel: 'Sì, annulla', danger: true });
    }

    renderCures();
  </script>
</body>
</html>
