<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Pagina raggiungibile solo per link diretto: non è collegata da nessuna
       schermata dell'applicazione e non va indicizzata. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Visita guidata · Programma ESG Carelink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   Visita guidata alla suite Aurea — Programma ESG Carelink
   ------------------------------------------------------------
   Percorso unico su due applicazioni. Il file è identico nei due
   repository: cambia solo la costante LOCAL_APP più sotto, che dice
   quale delle due è servita da questo dominio. Le schermate dell'altra
   arrivano via iframe dal suo dominio pubblico.

   La pagina non dipende da styles.css delle app: ha una sua shell, così
   resta uguale ovunque venga pubblicata e non eredita l'accento dell'una
   o dell'altra.
   ============================================================ */

:root {
  --ink:        #14201C;
  --ink-2:      #3B4B45;
  --muted:      #6B7C75;
  --line:       #D8E2DC;
  --line-soft:  #E9F0EC;
  --paper:      #EEF3F0;
  --surface:    #FFFFFF;
  --surface-2:  #F6F9F7;

  --fund:       #0F6E56;   /* verde programma */
  --fund-soft:  #E2EFE9;
  --care:       #2F6FD9;   /* AureaCare */
  --care-soft:  #E7EFFC;
  --shuttle:    #0B8C8B;   /* AureaShuttle */
  --shuttle-soft:#DEF1F0;
  --suite:      #C96A00;   /* marcatore di suite */
  --suite-soft: #FBEEDC;

  --r:  12px;
  --r-s: 8px;
  --shadow: 0 1px 2px rgba(16,48,38,.05), 0 18px 40px -24px rgba(16,48,38,.45);

  --bar-h: 62px;
  --foot-h: 68px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

/* ---------- barra superiore ---------- */
.topbar {
  height: var(--bar-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 30;
}
.mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark-logo {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: var(--fund); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; letter-spacing: -.02em;
}
.mark-txt { min-width: 0; }
.mark-txt b { display: block; font-size: 14px; font-weight: 700; line-height: 1.2; }
.mark-txt span {
  display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.topbar-spacer { flex: 1; }

.progress-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
.progress-track {
  width: clamp(90px, 22vw, 280px); height: 5px; border-radius: 999px;
  background: var(--line-soft); overflow: hidden;
}
.progress-fill { height: 100%; width: 0; background: var(--fund); border-radius: 999px; transition: width .28s ease; }
.progress-txt { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* ---------- corpo ---------- */
.stage {
  height: calc(100% - var(--bar-h) - var(--foot-h));
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
  gap: 0;
  overflow: hidden;
}

/* ---------- colonna schermata ---------- */
.viewport {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  overflow: auto;
  background:
    radial-gradient(1100px 520px at 50% -10%, rgba(15,110,86,.07), transparent 60%),
    var(--paper);
}

.device { position: relative; }
.device-shell {
  position: relative; overflow: hidden; background: #fff;
  box-shadow: var(--shadow);
}
.device--phone .device-shell { border-radius: 26px; border: 8px solid #19241F; }
.device--desktop .device-shell { border-radius: 10px; border: 1px solid var(--line); }

.device-shell iframe {
  display: block; border: 0; background: #fff;
  transform-origin: 0 0;
}

/* velo che intercetta i click quando la schermata è bloccata */
.veil {
  position: absolute; inset: 0; z-index: 5;
  background: transparent; cursor: default;
}
.device.unlocked .veil { display: none; }
.device.unlocked .device-shell { box-shadow: 0 0 0 3px var(--suite), var(--shadow); }

.device-tag {
  position: absolute; top: -11px; left: 16px; z-index: 6;
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; border: 1px solid;
  background: var(--surface);
}
.device-tag.care    { color: var(--care);    border-color: #BBD3F6; }
.device-tag.shuttle { color: var(--shuttle); border-color: #A8DCDA; }

.unlocked-note {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: -34px;
  display: none; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; color: var(--suite);
  background: var(--suite-soft); border: 1px solid #F0D3AB;
  padding: 5px 12px; border-radius: 999px; white-space: nowrap;
}
.device.unlocked .unlocked-note { display: inline-flex; }

.frame-fallback {
  position: absolute; inset: 0; z-index: 8;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 28px; text-align: center;
  background: var(--surface-2); color: var(--muted); font-size: 13.5px;
}
.device.failed .frame-fallback { display: flex; }

/* ---------- colonna commento ---------- */
.panel {
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 26px 26px 32px;
}

.chapter-line {
  display: flex; align-items: center; gap: 9px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px;
}
.chapter-num {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--fund-soft); color: var(--fund); font-size: 11px;
}

.panel h1 {
  font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em;
  margin: 0 0 4px; text-wrap: balance;
}
.where {
  font-size: 11.5px; color: var(--muted); margin: 0 0 18px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
.pill {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px;
}
.pill.care    { background: var(--care-soft);    color: var(--care); }
.pill.shuttle { background: var(--shuttle-soft); color: var(--shuttle); }
.pill.role    { background: var(--surface-2);    color: var(--ink-2); border: 1px solid var(--line); }

.lead { font-size: 15px; line-height: 1.62; color: var(--ink-2); margin: 0 0 16px; }

.points { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 9px; }
.points li {
  display: flex; gap: 10px; font-size: 13.8px; line-height: 1.52; color: var(--ink-2);
}
.points li::before {
  content: ''; flex: none; width: 5px; height: 5px; border-radius: 50%;
  background: var(--fund); margin-top: 8px;
}
.points strong { color: var(--ink); font-weight: 700; }

.focus {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--fund-soft); border: 1px solid #C6E2D7; border-radius: var(--r-s);
  padding: 11px 13px; font-size: 13.2px; line-height: 1.5; color: #0B4E3D;
  margin-bottom: 18px;
}
.focus svg { flex: none; margin-top: 2px; }

.try-btn {
  width: 100%; padding: 11px 14px; border-radius: var(--r-s); cursor: pointer;
  font-family: inherit; font-size: 13.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.try-btn:hover { background: #EDF3EF; }
.device-is-unlocked .try-btn { background: var(--suite-soft); border-color: #F0D3AB; color: #8A4A00; }
.try-hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 9px 0 0; }

.open-new {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
  font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none;
}
.open-new:hover { color: var(--ink); }

/* ---------- barra inferiore ---------- */
.footbar {
  height: var(--foot-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  position: relative; z-index: 30;
}
.nav-btn {
  height: 40px; padding: 0 16px; border-radius: var(--r-s); cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .15s ease, opacity .15s ease;
}
.nav-btn:hover:not(:disabled) { background: var(--surface-2); }
.nav-btn:disabled { opacity: .4; cursor: default; }
.nav-btn--go { background: var(--fund); border-color: var(--fund); color: #fff; }
.nav-btn--go:hover:not(:disabled) { background: #0C5D49; }
.foot-spacer { flex: 1; }

.dots { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; overflow: hidden; }
.dot {
  width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: var(--line); transition: background .15s ease, transform .15s ease;
}
.dot:hover { transform: scale(1.35); }
.dot.done { background: #9FC4B6; }
.dot.now  { background: var(--fund); transform: scale(1.45); }

/* ---------- indice ---------- */
.index-overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,24,19,.45);
  display: none; align-items: flex-end; justify-content: center;
  padding: 24px;
}
.index-overlay.open { display: flex; }
.index-card {
  background: var(--surface); border-radius: var(--r); width: min(880px, 100%);
  max-height: min(78vh, 720px); overflow-y: auto; box-shadow: var(--shadow);
  padding: 22px 24px 26px;
}
.index-card h2 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.index-card > p { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.chapter-block { margin-bottom: 18px; }
.chapter-block:last-child { margin-bottom: 0; }
.chapter-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
}
.chapter-title::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }
.index-list { display: grid; gap: 4px; }
.index-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: var(--r-s); border: 1px solid transparent;
  background: transparent; cursor: pointer; font-family: inherit; font-size: 13.5px;
  color: var(--ink-2);
}
.index-item:hover { background: var(--surface-2); }
.index-item.now { background: var(--fund-soft); border-color: #C6E2D7; color: var(--ink); font-weight: 700; }
.index-n { font-size: 11px; color: var(--muted); width: 20px; flex: none; }
.index-item.now .index-n { color: var(--fund); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  body { overflow: auto; }
  .stage { height: auto; grid-template-columns: 1fr; }
  .viewport { padding: 18px 14px 8px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding: 20px 18px 28px; }
  .footbar {
    position: sticky; bottom: 0;
    box-shadow: 0 -6px 20px -12px rgba(16,48,38,.4);
  }
  .dots { display: none; }
}
@media (max-width: 560px) {
  .mark-txt span { display: none; }
  .progress-track { width: 80px; }
  .nav-btn { padding: 0 12px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="mark">
      <div class="mark-logo">A</div>
      <div class="mark-txt">
        <b>Visita guidata</b>
        <span>Programma ESG Carelink</span>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="progress-wrap">
      <span class="progress-txt" id="prog-txt">1 / 1</span>
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
  </header>

  <main class="stage">
    <section class="viewport" id="viewport">
      <div class="device" id="device">
        <span class="device-tag" id="dev-tag">AureaCare</span>
        <div class="device-shell" id="dev-shell">
          <iframe id="frame" title="Schermata dell'applicazione" loading="eager"></iframe>
          <div class="veil" id="veil" title="Schermata in sola visione — un clic la sblocca"></div>
          <div class="frame-fallback">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
            <p style="margin:0">Questa schermata non si è caricata.<br>Può aprirsi in una scheda a parte.</p>
            <a class="nav-btn" id="fallback-link" href="#" target="_blank" rel="noopener">Apri la schermata</a>
          </div>
        </div>
        <span class="unlocked-note">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V7a5 5 0 0 1 9.9-1"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>
          Schermata sbloccata: si può usare
        </span>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="chapter-line">
        <span class="chapter-num" id="ch-num">1</span>
        <span id="ch-name">Capitolo</span>
      </div>
      <h1 id="st-title">Titolo</h1>
      <p class="where" id="st-where"></p>
      <p class="lead" id="st-lead"></p>
      <ul class="points" id="st-points"></ul>
      <div class="focus" id="st-focus">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
        <span id="st-focus-txt"></span>
      </div>

      <button class="try-btn" id="try-btn" type="button"></button>
      <p class="try-hint" id="try-hint"></p>

      <a class="open-new" id="open-new" href="#" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        Apri questa schermata in una scheda a parte
      </a>
    </aside>
  </main>

  <footer class="footbar">
    <button class="nav-btn" id="btn-prev" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Indietro
    </button>
    <button class="nav-btn" id="btn-index" type="button" title="Tutte le tappe">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      Tappe
    </button>
    <div class="foot-spacer"></div>
    <div class="dots" id="dots"></div>
    <div class="foot-spacer"></div>
    <button class="nav-btn nav-btn--go" id="btn-next" type="button">
      Avanti
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </footer>

  <div class="index-overlay" id="index-overlay">
    <div class="index-card" id="index-card">
      <h2>Le tappe della visita</h2>
      <p id="index-sub"></p>
      <div id="index-body"></div>
    </div>
  </div>

  <script>
/* ============================================================
   LOCAL_APP — l'unica riga che cambia fra i due repository.
   Dice quale applicazione è servita da QUESTO dominio: le sue
   schermate si caricano per percorso relativo (così il tutorial
   funziona anche aprendo i file in locale), quelle dell'altra
   dal dominio pubblico della suite.
   ============================================================ */
const LOCAL_APP = 'care';

const APP = {
  care: {
    name: 'AureaCare',
    base: 'https://aureacarepoc.vercel.app',
    accent: 'care'
  },
  shuttle: {
    name: 'AureaShuttle',
    base: 'https://aureashuttlepoc.vercel.app',
    accent: 'shuttle'
  }
};

const CHAPTERS = [
  'L’ingresso nel programma',
  'Prenotare una cura',
  'Il trasporto porta-a-porta',
  'Dopo la visita',
  'Il coordinamento del trasporto',
  'Il governo del programma'
];

/* Ogni tappa: app di appartenenza, schermata, tipo di dispositivo, ruolo,
   e il commento che la accompagna. Il taglio è di riepilogo: cosa fa la
   schermata e perché esiste, senza entrare nel dettaglio dei singoli campi. */
const STEPS = [

  /* ---------- 1 · L'ingresso nel programma ---------- */
  {
    ch: 0, app: 'care', role: 'Paziente', device: 'phone', url: 'index.html',
    title: 'L’accesso alla piattaforma',
    lead: 'Il punto di partenza è un accesso unico per tutta la suite: le stesse credenziali valgono su AureaCare e su AureaShuttle, e il passaggio da un’applicazione all’altra non richiede un secondo ingresso.',
    points: [
      '<strong>Solo credenziali</strong>: nessuna identità digitale, per scelta di programma.',
      'La schermata dichiara subito la promessa: strutture private certificate, <strong>senza costi a carico</strong>.',
      'Chi non ha ancora un account passa da qui alla registrazione assistita.'
    ],
    focus: 'In basso, il richiamo al Programma Carelink e ad Alphio APS: l’applicazione non si presenta mai come un servizio commerciale.'
  },
  {
    ch: 0, app: 'care', role: 'Paziente', device: 'phone', url: 'onboarding.html',
    title: 'La registrazione in cinque passi',
    lead: 'L’ingresso nel programma non è spontaneo: è un ente del territorio a segnalare la persona. La registrazione parte da lì e raccoglie in sequenza dati, requisito di accesso, indirizzo, quadro clinico e consensi.',
    points: [
      '<strong>Codice di segnalazione</strong>: il sistema riconosce dal codice l’ente che ha segnalato e l’associazione che seguirà la presa in carico.',
      '<strong>Livello di accesso</strong>: i tre requisiti sono alternativi, quindi si chiede solo il documento del livello scelto, più la carta d’identità.',
      '<strong>Consensi firmati</strong>: le dichiarazioni obbligatorie si sottoscrivono con firma elettronica avanzata, non con una semplice spunta.'
    ],
    focus: 'Il passaggio fra i passi è bloccante: senza codice valido, senza documenti e senza firma la registrazione non si chiude.'
  },
  {
    ch: 0, app: 'care', role: 'Paziente', device: 'phone', url: 'home.html',
    title: 'La home del percorso di cura',
    lead: 'Una volta dentro, la home riassume lo stato del programma per quella persona: a che punto è, cosa c’è in arrivo e cosa richiede attenzione. Non compare mai un saldo, perché non c’è nulla da pagare.',
    points: [
      'In cima, l’eventuale <strong>avviso di documento in scadenza</strong>: arriva trenta giorni prima, in tempo per rinnovarlo.',
      'La <strong>prossima prenotazione</strong> con struttura, data e stato della validazione.',
      'L’<strong>impatto personale</strong> del percorso: emissioni evitate, ore di caregiver liberate, sedute non interrotte.'
    ],
    focus: 'La barra in basso ha quattro voci soltanto — Home, Prenota, Cure, Profilo: l’applicazione resta volutamente essenziale.'
  },

  /* ---------- 2 · Prenotare una cura ---------- */
  {
    ch: 1, app: 'care', role: 'Paziente', device: 'phone', url: 'book-care.html',
    title: 'Il catalogo delle prestazioni',
    lead: 'Le prestazioni coperte dalla convenzione sono raccolte in un catalogo a tre sezioni: visite specialistiche, diagnostica strumentale e cicli di cure ricorrenti.',
    points: [
      '<strong>Fascia A</strong> — visite specialistiche, dalla prima visita ai controlli.',
      '<strong>Fascia B</strong> — diagnostica: risonanza, TC, ecografia, medicina nucleare.',
      '<strong>Cicli ricorrenti</strong> — oncologia, dialisi, neurologia, riabilitazione: sono quelli che danno diritto al trasporto gratuito.'
    ],
    focus: 'Ogni voce dichiara la copertura del programma a parole, mai con un importo: il costo non è un’informazione che serve a chi riceve la cura.'
  },
  {
    ch: 1, app: 'care', role: 'Paziente', device: 'phone', url: 'structures.html',
    title: 'Le strutture convenzionate',
    lead: 'La rete è fatta di sole strutture private certificate ISO 9001 o JCI, mostrate su mappa e in elenco, ordinabili per vicinanza, disponibilità o valutazione.',

const SIZE = {
  phone:   { w: 400, h: 860, maxW: 400 },
  desktop: { w: 1440, h: 900, maxW: 1180 }
};

let i = 0;
let unlocked = false;
let loadTimer = null;

/* Le schermate dell'applicazione locale si caricano per percorso relativo:
   così la visita guidata funziona anche aprendo i file da disco. Quelle
   dell'altra applicazione arrivano dal suo dominio pubblico. */
function stepUrl(step) {
  const rel = step.url + (step.url.includes('?') ? '&' : '?') + 'tour=1';
  return step.app === LOCAL_APP ? rel : APP[step.app].base + '/' + rel;
}

function absoluteUrl(step) {
  const rel = step.url;
  if (step.app !== LOCAL_APP) return APP[step.app].base + '/' + rel;
  return new URL(rel, location.href).href;
}

function fitFrame() {
  const step = STEPS[i];
  const size = SIZE[step.device];
  // Spazio utile: larghezza della colonna meno il padding, altezza della
  // finestra meno le barre. Su schermi stretti la colonna scorre.
  const availW = Math.min(el.viewport.clientWidth - 44, size.maxW);
  const availH = (window.innerWidth > 980)
    ? el.viewport.clientHeight - 56
    : Math.max(420, window.innerHeight * 0.62);
  const scale = Math.min(availW / size.w, availH / size.h, 1);
  el.frame.style.width  = size.w + 'px';
  el.frame.style.height = size.h + 'px';
  el.frame.style.transform = 'scale(' + scale + ')';
  el.shell.style.width  = Math.round(size.w * scale) + 'px';
  el.shell.style.height = Math.round(size.h * scale) + 'px';
}

function setUnlocked(state) {
  unlocked = state;
  el.device.classList.toggle('unlocked', state);
  el.panel.classList.toggle('device-is-unlocked', state);
  el.frame.style.pointerEvents = state ? 'auto' : 'none';
  el.tryBtn.innerHTML = state
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 14l-4 4 4 4"/><path d="M5 18h9a5 5 0 0 0 5-5V5"/></svg> Torna alla visita guidata'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg> Prova questa schermata';
  el.tryHint.textContent = state
    ? 'La schermata risponde ai comandi e si può scorrere. Navigando altrove il commento non corrisponderà più: si torna in pari con il pulsante qui sopra.'
    : 'La schermata è in sola visione, così il percorso resta allineato al commento. Sbloccala — anche con un clic sulla schermata — per scorrerla e provarla.';
}

function render() {
  const step = STEPS[i];
  const app = APP[step.app];

  // Frame
  clearTimeout(loadTimer);
  el.device.className = 'device device--' + step.device;
  el.tag.textContent = app.name;
  el.tag.className = 'device-tag ' + app.accent;
  el.frame.src = stepUrl(step);
  el.fallback.href = absoluteUrl(step);
  el.openNew.href = absoluteUrl(step);
  setUnlocked(false);
  fitFrame();
  // Se il riquadro non dà segno di vita, si offre l'apertura in una scheda.
  loadTimer = setTimeout(() => el.device.classList.add('failed'), 9000);

  // Commento
  el.chNum.textContent = step.ch + 1;
  el.chName.textContent = CHAPTERS[step.ch];
  el.title.textContent = step.title;
  el.where.innerHTML =
    '<span class="pill ' + app.accent + '">' + app.name + '</span>' +
    '<span class="pill role">' + step.role + '</span>' +
    '<span class="mono">' + step.url.split('?')[0] + '</span>';
  el.lead.textContent = step.lead;
  el.points.innerHTML = step.points.map(p => '<li><span>' + p + '</span></li>').join('');
  if (step.focus) { el.focusBox.style.display = 'flex'; el.focusTxt.textContent = step.focus; }
  else { el.focusBox.style.display = 'none'; }
  el.panel.scrollTop = 0;

  // Navigazione
  el.prev.disabled = i === 0;
  el.next.disabled = i === STEPS.length - 1;
  el.next.firstChild.textContent = i === STEPS.length - 1 ? 'Fine ' : 'Avanti ';
  el.progTxt.textContent = (i + 1) + ' / ' + STEPS.length;
  el.progFill.style.width = ((i + 1) / STEPS.length * 100) + '%';
  Array.from(el.dots.children).forEach((d, n) => {
    d.className = 'dot' + (n === i ? ' now' : n < i ? ' done' : '');
  });
  renderIndex();

  history.replaceState(null, '', '#tappa-' + (i + 1));
  document.title = 'Visita guidata · ' + step.title;
}

function go(n) {
  i = Math.max(0, Math.min(STEPS.length - 1, n));
  render();
}

function renderIndex() {
  el.indexSub.textContent = STEPS.length + ' tappe · ' + CHAPTERS.length +
    ' capitoli · due applicazioni, il percorso di chi riceve il servizio e quello di chi lo coordina';
  el.indexBody.innerHTML = CHAPTERS.map((ch, c) => {
    const items = STEPS
      .map((s, n) => ({ s, n }))
      .filter(x => x.s.ch === c)
      .map(x =>
        '<button class="index-item' + (x.n === i ? ' now' : '') + '" data-go="' + x.n + '">' +
        '<span class="index-n mono">' + String(x.n + 1).padStart(2, '0') + '</span>' +
        '<span>' + x.s.title + '</span>' +
        '<span class="pill ' + APP[x.s.app].accent + '" style="margin-left:auto">' + APP[x.s.app].name + '</span>' +
        '</button>'
      ).join('');
    return '<div class="chapter-block"><p class="chapter-title">' + (c + 1) + ' · ' + ch + '</p>' +
           '<div class="index-list">' + items + '</div></div>';
  }).join('');
}

// ---- avvio ----
STEPS.forEach((s, n) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.type = 'button';
  d.title = (n + 1) + ' · ' + s.title;
  d.addEventListener('click', () => go(n));
  el.dots.appendChild(d);
});

el.frame.addEventListener('load', () => {
  clearTimeout(loadTimer);
  el.device.classList.remove('failed');
});

el.prev.addEventListener('click', () => go(i - 1));
el.next.addEventListener('click', () => go(i + 1));
el.tryBtn.addEventListener('click', () => {
  // Richiudendo si ricarica la schermata: se la navigazione interna ha portato
  // altrove, la tappa torna esattamente com'era.
  if (unlocked) { el.frame.src = stepUrl(STEPS[i]); setUnlocked(false); }
  else setUnlocked(true);
});
el.veil.addEventListener('click', () => setUnlocked(true));

el.indexBtn.addEventListener('click', () => el.overlay.classList.add('open'));
el.overlay.addEventListener('click', (e) => {
  if (e.target === el.overlay) el.overlay.classList.remove('open');
  const btn = e.target.closest('[data-go]');
  if (btn) { go(Number(btn.dataset.go)); el.overlay.classList.remove('open'); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { el.overlay.classList.remove('open'); return; }
  if (el.overlay.classList.contains('open')) return;
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft')  go(i - 1);
});

window.addEventListener('resize', fitFrame);

// Tappa iniziale da #tappa-N o ?tappa=N, così un passaggio preciso è linkabile.
(function start() {
  const fromHash = (location.hash.match(/^#tappa-(\d+)$/) || [])[1];
  const fromQuery = new URLSearchParams(location.search).get('tappa');
  const n = parseInt(fromHash || fromQuery, 10);
  go(Number.isFinite(n) ? n - 1 : 0);
})();
  </script>
</body>
</html>
